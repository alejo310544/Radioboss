plugins {
    id 'com.android.application'
}

android {
    namespace 'com.doceestereo.radioboss12'
    compileSdk 35

    defaultConfig {
        applicationId 'com.doceestereo.radioboss12'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'com.github.naman14:TAndroidLame:1.1'
}
