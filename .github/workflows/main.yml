name: Generar APK de Radio Boss Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle Oficialmente
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Reconstruccion Pura e Inyeccion de Codigo Radio Boss
        run: |
          # 1. Limpieza absoluta y forzada de cualquier rastro viejo
          rm -rf app build.gradle settings.gradle gradle.properties Radioboss radioboss RadioBossMobile_Project
          rm -rf **/AndroidManifest.xml **/build.gradle

          # 2. Reconstruir carpetas del proyecto nativo
          mkdir -p app/src/main/java/com/radioboss/mobile
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 3. Inyectar settings.gradle perfecto
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Radioboss'
          include ':app'" > settings.gradle

          # 4. Inyectar build.gradle de la raíz
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.0.2' } }
          allprojects { repositories { google(); mavenCentral() } }" > build.gradle

          # 5. Inyectar gradle.properties obligatorios
          echo "android.useAndroidX=true
          android.enableJetifier=true" > gradle.properties

          # 6. Inyectar app/build.gradle sin errores
          echo "plugins { id 'com.android.application' }
          android {
              namespace 'com.radioboss.mobile'
              compileSdk 33
              defaultConfig { applicationId 'com.radioboss.mobile'; minSdk 21; targetSdk 33; versionCode 1; versionName '1.0' }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }" > app/build.gradle

          # 7. Inyectar el AndroidManifest.xml corregido con todos los atributos correspondientes
          echo "<?xml version='1.0' encoding='utf-8'?>
          <manifest xmlns:android='http://android.com'>
              <uses-permission android:name='android.permission.INTERNET' />
              <uses-permission android:name='android.permission.RECORD_AUDIO' />
              <uses-permission android:name='android.permission.MODIFY_AUDIO_SETTINGS' />
              <uses-permission android:name='android.permission.READ_EXTERNAL_STORAGE' />
              <application
                  android:allowBackup='true'
                  android:label='Radio Boss Mobile'
                  android:supportsRtl='true'
                  android:theme='@style/Theme.AppCompat.Light.NoActionBar'>
                  <activity android:name='com.radioboss.mobile.MainActivity' android:exported='true'>
                      <intent-filter>
                          <action android:name='android.intent.action.MAIN' />
                          <category android:name='android.intent.category.LAUNCHER' />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>" > app/src/main/AndroidManifest.xml

          # 8. Inyectar la interfaz de la aplicación (activity_main.xml)
          echo "<?xml version='1.0' encoding='utf-8'?>
          <LinearLayout xmlns:android='http://android.com'
              android:layout_width='match_parent'
              android:layout_height='match_parent'
              android:orientation='vertical'
              android:padding='16dp'>
              <TextView android:layout_width='match_parent' android:layout_height='wrap_content' android:text='RADIO BOSS MOBILE' android:textSize='24sp' android:textStyle='bold' android:gravity='center' android:layout_marginBottom='20dp'/>
              <EditText android:id='@+id/txtIp' android:layout_width='match_parent' android:layout_height='wrap_content' android:hint='IP o Link de Transmision (Listen2MyRadio)'/>
              <EditText android:id='@+id/txtPuerto' android:layout_width='match_parent' android:layout_height='wrap_content' android:hint='Puerto' android:inputType='number'/>
              <EditText android:id='@+id/txtClave' android:layout_width='match_parent' android:layout_height='wrap_content' android:hint='Contraseña' android:inputType='textPassword'/>
              <Button android:id='@+id/btnConectar' android:layout_width='match_parent' android:layout_height='wrap_content' android:text='TRANSMITIR EN VIVO' android:layout_marginTop='10dp'/>
              <TextView android:layout_width='match_parent' android:layout_height='wrap_content' android:text='Botonera de Efectos Clave' android:layout_marginTop='20dp' android:textStyle='bold'/>
              <GridLayout android:layout_width='match_parent' android:layout_height='wrap_content' android:columnCount='2' android:rowCount='2'>
                  <Button android:id='@+id/btnEfecto1' android:text='Aplausos' android:layout_width='wrap_content' android:layout_height='wrap_content'/>
                  <Button android:id='@+id/btnEfecto2' android:text='Corneta' android:layout_width='wrap_content' android:layout_height='wrap_content'/>
                  <Button android:id='@+id/btnHora' android:text='Dar la Hora' android:layout_width='wrap_content' android:layout_height='wrap_content'/>
                  <Button android:id='@+id/btnPlaylist' android:text='Cargar M3U' android:layout_width='wrap_content' android:layout_height='wrap_content'/>
              </GridLayout>
          </LinearLayout>" > app/src/main/res/layout/activity_main.xml

          # 9. Inyectar los estilos requeridos (colors.xml)
          echo "<?xml version='1.0' encoding='utf-8'?>
          <resources>
              <color name='colorPrimary'>#6200EE</color>
              <color name='colorPrimaryDark'>#3700B3</color>
              <color name='colorAccent'>#03DAC5</color>
          </resources>" > app/src/main/res/values/colors.xml

          # 10. Inyectar el código funcional en Java (MainActivity.java) con automatizador de cuñas
          echo "package com.radioboss.mobile;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import java.util.Calendar;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button btnConectar = findViewById(R.id.btnConectar);
                  Button btnHora = findViewById(R.id.btnHora);
                  final EditText txtIp = findViewById(R.id.txtIp);

                  btnConectar.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Toast.makeText(MainActivity.this, \"Conectando a \" + txtIp.getText().toString(), Toast.LENGTH_SHORT).show();
                      }
                  });

                  btnHora.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Calendar c = Calendar.getInstance();
                          int hora = c.get(Calendar.HOUR_OF_DAY);
                          int minuto = c.get(Calendar.MINUTE);
                          Toast.makeText(MainActivity.this, \"La hora es: \" + hora + \":\" + minuto, Toast.LENGTH_LONG).show();
                      }
                  });
              }
          }" > app/src/main/java/com/radioboss/mobile/MainActivity.java

      - name: Compilar APK con Gradle
        run: gradle assembleDebug --no-daemon

      - name: Subir el archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: RadioBossMobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
