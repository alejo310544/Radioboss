name: Generar APK de Radio Boss Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle Oficialmente
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Limpiar y Extraer ZIP Oficial
        run: |
          # 1. Eliminar carpetas sueltas viejas para evitar conflictos
          rm -rf app build.gradle settings.gradle gradle.properties

          # 2. Descomprimir el ZIP que acabas de subir
          mkdir -p temp_extracted
          unzip -q RadioBossMobile_Project.zip -d temp_extracted/

          # 3. Mover los archivos limpios a la raíz de compilación
          cp -r temp_extracted/* . || cp -r temp_extracted/RadioBossMobile_Project/* . || true
          rm -rf temp_extracted

          # 4. Forzar la creación de la configuración limpia de Gradle
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "rootProject.name = 'Radioboss'" >> settings.gradle
          echo "include ':app'" >> settings.gradle

          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.0.2' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle

          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # 5. Sobrescribir el manifiesto roto por el correcto con permisos de radio
          mkdir -p app/src/main
          echo "<?xml version='1.0' encoding='utf-8'?>
          <manifest xmlns:android='http://android.com'>
              <uses-permission android:name='android.permission.INTERNET' />
              <uses-permission android:name='android.permission.RECORD_AUDIO' />
              <uses-permission android:name='android.permission.MODIFY_AUDIO_SETTINGS' />
              <uses-permission android:name='android.permission.READ_EXTERNAL_STORAGE' />
              <application
                  android:allowBackup='true'
                  android:label='Radio Boss Mobile'
                  android:supportsRtl='true'
                  android:theme='@style/Theme.AppCompat.Light.NoActionBar'>
                  <activity android:name='.MainActivity' android:exported='true'>
                      <intent-filter>
                          <action android:name='android.intent.action.MAIN' />
                          <category android:name='android.intent.category.LAUNCHER' />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>" > app/src/main/AndroidManifest.xml

      - name: Compilar APK con Gradle
        run: gradle assembleDebug --no-daemon

      - name: Subir el archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: RadioBossMobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
