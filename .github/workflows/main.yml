name: Generar APK de Radio Boss Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle Oficialmente
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Corregir archivos gradle de forma automatica
        run: |
          # Elimina restricciones estrictas de repositorios si existen en settings.gradle
          if [ -f settings.gradle ]; then
            sed -i '/dependencyResolutionManagement/I,/^}/d' settings.gradle
            echo -e "\npluginManagement { repositories { google(); mavenCentral() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }" >> settings.gradle
          fi
          
          # Inyecta los repositorios en el archivo build.gradle principal
          if [ -f build.gradle ]; then
            echo -e "\nallprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          fi

      - name: Compilar APK con Gradle
        run: gradle assembleDebug --no-daemon

      - name: Subir el archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: RadioBossMobile-DebugAPK
          path: app/build/outputs/apk/debug/app-debug.apk
