
name: Compilar RadioVoz Movil

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Buscar y extraer ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -type f -iname "*.zip" ! -path "./.git/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No se encontró el archivo ZIP."
            exit 1
          fi

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          PUBSPEC=$(find project -name pubspec.yaml -type f -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "::error::El ZIP no contiene pubspec.yaml."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Preparar Android
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.radiovoz .
          fi

          echo "Versiones de Flutter y Java:"
          flutter --version
          java -version

      - name: Instalar dependencias
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Revisar código Dart
        run: |
          cd "$PROJECT_DIR"
          flutter analyze

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RadioVoz-Movil-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
