name: Compilar RadioBos1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "RadioBos1.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Buscar y descomprimir ZIP
        shell: bash
        run: |
          ZIP_PATH="$(find . -type f -name 'RadioBos1.zip' -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::No se encontró RadioBos1.zip"
            exit 1
          fi

          mkdir -p RadioBos1_source
          unzip -o "$ZIP_PATH" -d RadioBos1_source

      - name: Compilar proyecto Android
        shell: bash
        run: |
          cd RadioBos1_source
          gradle --version
