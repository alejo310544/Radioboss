name: Compilar RadioVoz Movil

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar estructura Android estandar
        run: flutter create --platforms=android --org com.radiovoz .

      - name: Formatear codigo Dart
        run: dart format lib

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioVoz-Movil-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
