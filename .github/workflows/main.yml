
name: Compilar RadioVoz Movil

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extraer ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir project
          unzip -q RadioVozMovil_GitHub.zip -d project

      - name: Preparar Android
        working-directory: project
        run: flutter create --platforms=android --org com.radiovoz .

      - name: Descargar dependencias
        working-directory: project
        run: flutter pub get

      - name: Compilar APK
        working-directory: project
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioVoz-Movil-APK
          path: project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
