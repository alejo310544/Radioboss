name: Generar APK de Radio Boss Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle Oficialmente
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Reconstruir Archivos Gradle Limpios e Inteligentes
        run: |
          # 1. Detectar automáticamente el paquete real del proyecto para evitar fallos de compilación
          PACKAGE_NAME=$(grep -r "package " app/src/main/java/ | head -n 1 | awk '{print $2}' | sed 's/;//')
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="com.radioboss.mobile"
          fi
          echo "El paquete detectado es: $PACKAGE_NAME"

          # 2. Generar settings.gradle perfecto
          echo "pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Radioboss'
          include ':app'" > settings.gradle

          # 3. Generar build.gradle raíz perfecto
          echo "buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.0.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }" > build.gradle

          # 4. Generar app/build.gradle limpio sin errores de formato
          echo "plugins {
              id 'com.android.application'
          }
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 33
              defaultConfig {
                  applicationId '$PACKAGE_NAME'
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              lintOptions {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }" > app/build.gradle

      - name: Compilar APK con Gradle
        run: gradle assembleDebug --no-daemon

      - name: Subir el archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: RadioBossMobile-DebugAPK
          path: app/build/outputs/apk/debug/app-debug.apk
