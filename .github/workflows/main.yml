name: Build RadioBoss12 desde ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'RadioBoss12_M3U_Sesion_SegundoPlano_v6.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar que existe el ZIP del proyecto
        run: test -f RadioBoss12_M3U_Sesion_SegundoPlano_v6.zip

      - name: Extraer el proyecto desde el ZIP
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/radioboss12-src"
          unzip -o RadioBoss12_M3U_Sesion_SegundoPlano_v6.zip -d "$RUNNER_TEMP/radioboss12-src"
          cp -a "$RUNNER_TEMP/radioboss12-src/." "$GITHUB_WORKSPACE/"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de prueba
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: RadioBoss12-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
