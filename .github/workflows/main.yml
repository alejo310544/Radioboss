name: Generar APK de Radio Boss Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Conceder permisos de ejecucion a Gradle
        run: chmod +x gradlew
        continue-on-error: true

      - name: Compilar e instalar dependencias con Gradle
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Subir el archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: RadioBossMobile-DebugAPK
          path: app/build/outputs/apk/debug/app-debug.apk
