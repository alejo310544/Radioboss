name: Generar APK de Radio Boss Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Java JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Instalar Gradle compatible de forma manual
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://gradle.org
          sudo mkdir /opt/gradle
          sudo unzip -d /opt/gradle gradle-7.5-bin.zip
          export PATH=$PATH:/opt/gradle/gradle-7.5/bin
          echo "/opt/gradle/gradle-7.5/bin" >> $GITHUB_PATH

      - name: Compilar APK con Gradle compatible
        run: gradle assembleDebug

      - name: Subir el archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: RadioBossMobile-DebugAPK
          path: app/build/outputs/apk/debug/app-debug.apk
