name: Generar APK de Radio Boss Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle Oficialmente
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Formatear y Reestructurar archivos Gradle de Raiz
        run: |
          # 1. Reescribir settings.gradle con el orden correcto exacto obligatorio
          echo "pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Radioboss'
          include ':app'" > settings.gradle

          # 2. Asegurar repositorios limpios en el build.gradle de la raíz
          echo "buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.0.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }" > build.gradle

      - name: Compilar APK con Gradle
        run: gradle assembleDebug --no-daemon

      - name: Subir el archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: RadioBossMobile-DebugAPK
          path: app/build/outputs/apk/debug/app-debug.apk
