name: Android CI - Compilar Radio Boss Movil

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Codigo Fuente
      uses: actions/checkout@v4

    - name: Configurar Java 17 (Alta Compatibilidad)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Otorgar Permisos de Ejecucion a Gradle
      run: chmod +x gradlew

    - name: Validar y Aceptar Licencias de Android SDK
      run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Compilar APK de Depuracion (Debug)
      run: ./gradlew assembleDebug

    - name: Subir APK Compilado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: RadioBossMovil-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
