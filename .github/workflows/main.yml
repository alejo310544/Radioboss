
name: Generar APK de Radio Boss Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle Oficialmente
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Reconstruir Archivos Gradle en la Raiz Real
        run: |
          # 1. Intentar buscar el nombre de paquete real en el Java existente
          PACKAGE_NAME=$(grep -r "package " app/src/main/java/ | head -n 1 | awk '{print $2}' | sed 's/;//')
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="com.radioboss.mobile"
          fi
          echo "El paquete detectado es: $PACKAGE_NAME"

          # 2. Generar settings.gradle perfecto en la raiz principal
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "rootProject.name = 'Radioboss'" >> settings.gradle
          echo "include ':app'" >> settings.gradle

          # 3. Generar build.gradle raiz perfecto en la raiz principal
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.0.2' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle

          # 4. Generar app/build.gradle limpio en el modulo app correcto
          echo "plugins { id 'com.android.application' }
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 33
              defaultConfig { applicationId '$PACKAGE_NAME'; minSdk 21; targetSdk 33; versionCode 1; versionName '1.0' }
              buildTypes { release { minifyEnabled false } }
              lintOptions { abortOnError false; checkReleaseBuilds false }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }" > app/build.gradle

          # 5. Crear archivo gradle.properties de compatibilidad
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # 6. Reescribir el manifest defectuoso en la ruta correcta de la app
          mkdir -p app/src/main
          echo "<?xml version='1.0' encoding='utf-8'?>
          <manifest xmlns:android='http://android.com'>
              
              <uses-permission android:name='android.permission.INTERNET' />
              <uses-permission android:name='android.permission.RECORD_AUDIO' />
              <uses-permission android:name='android.permission.MODIFY_AUDIO_SETTINGS' />
              <uses-permission android:name='android.permission.READ_EXTERNAL_STORAGE' />

              <application
                  android:allowBackup='true'
                  android:icon='@mipmap/ic_launcher'
                  android:label='Radio Boss Mobile'
                  android:roundIcon='@mipmap/ic_launcher_round'
                  android:supportsRtl='true'
                  android:theme='@style/Theme.AppCompat.Light.NoActionBar'>
                  
                  <activity
                      android:name='.MainActivity'
                      android:exported='true'>
                      <intent-filter>
                          <action android:name='android.intent.action.MAIN' />
                          <category android:name='android.intent.category.LAUNCHER' />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>" > app/src/main/AndroidManifest.xml

      - name: Compilar APK con Gradle
        run: gradle assembleDebug --no-daemon

      - name: Subir el archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: RadioBossMobile-DebugAPK
          path: app/build/outputs/apk/debug/app-debug.apk
