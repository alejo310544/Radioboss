name: Generar APK de Radio Boss Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle Oficialmente
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Limpieza Radical y Reconstruccion Absoluta
        run: |
          # 1. Copiar el archivo ZIP a un lugar seguro fuera del repositorio temporalmente
          cp RadioBossMobile_Project.zip /tmp/RadioBossMobile_Project.zip

          # 2. BORRADO TOTAL: Eliminar absolutamente todo lo que hay en el directorio de trabajo
          # Esto destruye cualquier carpeta duplicada 'Radioboss' o 'radioboss' de raíz
          rm -rf * .git*

          # 3. Traer de regreso el ZIP limpio y extraerlo directamente en la raíz pura
          cp /tmp/RadioBossMobile_Project.zip .
          unzip -q RadioBossMobile_Project.zip
          
          # Si los archivos venían dentro de una subcarpeta interna en el ZIP, los sacamos a la raíz
          if [ -d "RadioBossMobile_Project" ]; then
            cp -r RadioBossMobile_Project/* .
            rm -rf RadioBossMobile_Project
          fi

          # Asegurar destrucción total de carpetas fantasmas clonadas antes
          rm -rf Radioboss radioboss RadioBossMobile_Project.zip

          # 4. Crear archivos de configuración de Gradle milimétricamente perfectos
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "rootProject.name = 'Radioboss'" >> settings.gradle
          echo "include ':app'" >> settings.gradle

          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.0.2' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle

          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # 5. REESCRITURA INYECTABLE: Crear el manifiesto limpio con los permisos de radio correctos
          mkdir -p app/src/main
          echo "<?xml version='1.0' encoding='utf-8'?>
          <manifest xmlns:android='http://android.com'>
              <uses-permission android:name='android.permission.INTERNET' />
              <uses-permission android:name='android.permission.RECORD_AUDIO' />
              <uses-permission android:name='android.permission.MODIFY_AUDIO_SETTINGS' />
              <uses-permission android:name='android.permission.READ_EXTERNAL_STORAGE' />
              <application
                  android:allowBackup='true'
                  android:label='Radio Boss Mobile'
                  android:supportsRtl='true'
                  android:theme='@style/Theme.AppCompat.Light.NoActionBar'>
                  <activity android:name='.MainActivity' android:exported='true'>
                      <intent-filter>
                          <action android:name='android.intent.action.MAIN' />
                          <category android:name='android.intent.category.LAUNCHER' />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>" > app/src/main/AndroidManifest.xml

      - name: Compilar APK con Gradle (Entorno Limpio)
        run: gradle assembleDebug --no-daemon

      - name: Subir el archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: RadioBossMobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
