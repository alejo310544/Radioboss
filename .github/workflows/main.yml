name: Generar APK de Radio Boss Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle Oficialmente
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Agregar Repositorios de Google a Gradle
        run: |
          mkdir -p ~/.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" > ~/.gradle/init.gradle

      - name: Compilar APK con Gradle
        run: gradle assembleDebug

      - name: Subir el archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: RadioBossMobile-DebugAPK
          path: app/build/outputs/apk/debug/app-debug.apk
